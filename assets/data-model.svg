<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title description">
  <title id="title">GLG Data Engineer Case Study data model</title>
  <description id="description">Blueprint data model showing snapshot, ingestion, current profile, profile history, and company headcount relations. The current-profile to profile-history relationship is logical rather than an enforced foreign key.</description>
  <defs>
    <pattern id="minorGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2d6086" stroke-width="1" opacity=".22"/>
    </pattern>
    <pattern id="majorGrid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#minorGrid)"/>
      <path d="M100 0H0V100" fill="none" stroke="#4a80a8" stroke-width="1.5" opacity=".28"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#65d5ff"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .title { fill: #d9f3ff; font-size: 28px; font-weight: 800; letter-spacing: .04em; }
      .eyebrow { fill: #7edcff; font-size: 13px; font-weight: 700; letter-spacing: .18em; }
      .name { fill: #d9f3ff; font-size: 17px; font-weight: 700; }
      .field { fill: #a9d2e8; font-size: 14px; }
      .key { fill: #ffcf72; font-size: 13px; font-weight: 700; }
      .box { fill: #0c3350; stroke: #7edcff; stroke-width: 2; }
      .box-history { fill: #123b54; stroke: #ffbd59; stroke-width: 2; }
      .box-view { fill: #102b45; stroke: #52a8d5; stroke-width: 1.5; }
      .line { fill: none; stroke: #65d5ff; stroke-width: 2.5; marker-end: url(#arrow); }
      .logical { fill: none; stroke: #ffbd59; stroke-width: 2; stroke-dasharray: 8 8; }
      .caption { fill: #85b8d1; font-size: 13px; letter-spacing: .04em; }
      .note { fill: #ffcf72; font-size: 13px; font-weight: 700; }
      .marker { fill: #ffbd59; stroke: #fff0c2; stroke-width: 2; filter: url(#glow); }
      .marker-text { fill: #09263c; font-size: 13px; font-weight: 800; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <rect width="1440" height="760" fill="#082a44"/>
  <rect width="1440" height="760" fill="url(#majorGrid)"/>
  <path d="M34 34h55M34 34v55M1406 34h-55M1406 34v55M34 726h55M34 726v-55M1406 726h-55M1406 726v-55" fill="none" stroke="#4e94b9" stroke-width="2"/>

  <text x="72" y="72" class="sans eyebrow">DATA MODEL / BASELINE SCHEMA</text>
  <text x="72" y="112" class="sans title">Snapshots to current state and history</text>
  <text x="1368" y="72" text-anchor="end" class="sans caption">GLG CASE STUDY // 01</text>

  <path d="M325 258H385" class="line"/>
  <path d="M685 258H745" class="line"/>
  <path d="M1045 258H1105" class="logical"/>
  <path d="M895 380V488" class="line"/>

  <g transform="translate(72 172)">
    <rect width="253" height="172" rx="8" class="box"/>
    <text x="20" y="31" class="sans eyebrow">RAW</text>
    <text x="20" y="61" class="mono name">raw.profile_snapshot</text>
    <path d="M20 78H233" stroke="#2f6d91"/>
    <text x="20" y="104" class="mono key">snapshot_date</text><text x="160" y="104" class="mono field">date</text>
    <text x="20" y="128" class="mono field">profile_id</text><text x="160" y="128" class="mono field">text</text>
    <text x="20" y="152" class="mono field">is_active</text><text x="160" y="152" class="mono field">boolean</text>
  </g>

  <g transform="translate(385 172)">
    <rect width="300" height="172" rx="8" class="box"/>
    <text x="20" y="31" class="sans eyebrow">OPS</text>
    <text x="20" y="61" class="mono name">ops.snapshot_ingestion</text>
    <path d="M20 78H280" stroke="#2f6d91"/>
    <text x="20" y="104" class="mono key">snapshot_date</text><text x="190" y="104" class="mono field">date PK</text>
    <text x="20" y="128" class="mono field">source_file</text><text x="190" y="128" class="mono field">text</text>
    <text x="20" y="152" class="mono field">status</text><text x="190" y="152" class="mono field">text</text>
  </g>

  <g transform="translate(745 172)">
    <rect width="300" height="208" rx="8" class="box"/>
    <text x="20" y="31" class="sans eyebrow">MART / CURRENT</text>
    <text x="20" y="61" class="mono name">mart.current_profile</text>
    <path d="M20 78H280" stroke="#2f6d91"/>
    <text x="20" y="104" class="mono key">profile_id</text><text x="190" y="104" class="mono field">text PK</text>
    <text x="20" y="128" class="mono field">company</text><text x="190" y="128" class="mono field">text</text>
    <text x="20" y="152" class="mono field">title</text><text x="190" y="152" class="mono field">text</text>
    <text x="20" y="176" class="mono field">is_active</text><text x="190" y="176" class="mono field">boolean</text>
  </g>

  <g transform="translate(1105 172)">
    <rect width="300" height="208" rx="8" class="box-history"/>
    <text x="20" y="31" class="sans eyebrow">MART / SCD TYPE 2</text>
    <text x="20" y="61" class="mono name">mart.profile_history</text>
    <path d="M20 78H280" stroke="#8d6c36"/>
    <text x="20" y="104" class="mono key">profile_id</text><text x="190" y="104" class="mono field">text PK</text>
    <text x="20" y="128" class="mono key">valid_from</text><text x="190" y="128" class="mono field">datetime PK</text>
    <text x="20" y="152" class="mono field">valid_to</text><text x="190" y="152" class="mono field">datetime</text>
    <text x="20" y="176" class="mono field">is_active</text><text x="190" y="176" class="mono field">boolean</text>
  </g>

  <g transform="translate(745 488)">
    <rect width="300" height="136" rx="8" class="box-view"/>
    <text x="20" y="31" class="sans eyebrow">MART / VIEW</text>
    <text x="20" y="61" class="mono name">mart.company_headcount</text>
    <path d="M20 78H280" stroke="#2f6d91"/>
    <text x="20" y="104" class="mono field">company</text><text x="190" y="104" class="mono field">text</text>
    <text x="20" y="128" class="mono field">headcount</text><text x="190" y="128" class="mono field">integer</text>
  </g>

  <path d="M1075 276V404" class="logical"/>
  <circle cx="1075" cy="420" r="18" class="marker"/>
  <text x="1075" y="420" class="sans marker-text">L</text>
  <text x="1105" y="414" class="sans note">logical relationship</text>
  <text x="1105" y="434" class="sans caption">shared profile_id, not a baseline FK</text>

  <text x="72" y="690" class="sans caption">RAW rows are retained from dated Snapshots. MART tables expose current state, history, and aggregates.</text>
  <text x="1368" y="690" text-anchor="end" class="sans caption">PK = primary key</text>
</svg>
